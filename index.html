<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mona · Retentie</title>
<meta name="theme-color" content="#406D68">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mona Stats">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon-180-v2.png">
<link rel="icon" href="icon-192-v2.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F2EAD5;--ivory:#FBF4E4;--petrol:#406D68;--honey:#DDA552;--coral:#C96F4A;
    --ink:#3A342B;--mute:#8a8172;--line:#e7dcc2;--good:#4E8D5B;--surface:#FFFDF7
  }
  *{box-sizing:border-box;font-family:Comfortaa,system-ui,sans-serif;margin:0}
  html,body{background:var(--cream);color:var(--ink)}
  body{padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 34px)}
  .wrap{max-width:940px;margin:0 auto}
  .top{display:flex;align-items:center;gap:12px}
  /* De tegel toont het icoonbestand zelf. Stond hier eerder als losse inline-SVG met een
     nagetekende smiley, en die liep uit de pas met Edwards getekende knipoog in de iconen.
     Een bron, dus dat kan niet meer uiteenlopen. */
  .dot{width:30px;height:30px;border-radius:9px;flex:none;display:block}
  h1{font-size:19px;font-weight:700;flex:1}
  .refresh{border:1px solid var(--line);background:var(--surface);color:var(--mute);width:38px;height:38px;border-radius:11px;font-size:17px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
  .refresh:active{transform:scale(.94)}
  .refresh.spin svg{animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .subline{color:var(--mute);font-size:12px;margin:4px 0 18px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .live{color:var(--good);font-weight:700}
  .stale{color:var(--coral);font-weight:700}
  .grid{display:grid;grid-template-columns:1.15fr 1fr;gap:14px}
  @media(max-width:760px){.grid{grid-template-columns:1fr}}
  .grid>*{min-width:0}   /* anders duwt de brede verloopgrafiek de kaart, en dus de pagina, breder dan het scherm */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 20px}
  .full{grid-column:1 / -1}
  .ey{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--mute);font-weight:600}
  .hero{display:flex;flex-direction:column;justify-content:center}
  .herorow{display:flex;align-items:baseline;gap:14px;margin-top:6px;flex-wrap:wrap}
  .big{font-size:56px;font-weight:700;line-height:1}
  .badge{font-size:12px;font-weight:700;padding:5px 12px;border-radius:20px}
  .b-good{background:rgba(78,141,91,.15);color:var(--good)}
  .b-ok{background:rgba(231,162,62,.18);color:#b9791f}
  .b-stop{background:rgba(201,111,74,.18);color:var(--coral)}
  .b-none{background:rgba(138,129,114,.15);color:var(--mute)}
  .hint{color:var(--mute);font-size:12.5px;margin-top:10px;line-height:1.5}
  .legend{display:flex;gap:14px;margin-top:14px;font-size:11px;color:var(--mute);flex-wrap:wrap}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .sw{width:10px;height:10px;border-radius:3px;display:inline-block}
  .tiles{display:flex;flex-direction:column;gap:14px}
  .tile{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:15px 18px;display:flex;align-items:center;gap:14px}
  .tnum{font-size:30px;font-weight:700;line-height:1}
  .tlab{font-size:12.5px;color:var(--mute);line-height:1.35}
  .trendhead{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:6px}
  .callout{color:var(--good);font-weight:700;font-size:13px}
  .callout.up{color:#b9791f}
  .callout.flat{color:var(--mute)}
  .verloop{margin-top:14px;overflow-x:auto}
  .verloop svg{width:100%;min-width:520px;height:auto;display:block}
  .band{stroke:#d9cba9;stroke-width:1;stroke-dasharray:4 4}
  .ax{font-size:11px;fill:var(--mute)}
  .l30{fill:none;stroke:var(--petrol);stroke-width:2.6;stroke-linejoin:round}
  .l7{fill:none;stroke:var(--honey);stroke-width:1.6;stroke-linejoin:round;opacity:.85}
  .mark{stroke:var(--mute);stroke-width:1;stroke-dasharray:2 3}
  .markdot{fill:var(--surface);stroke:var(--mute);stroke-width:1}
  .marknr{font-size:10px;font-weight:700;fill:var(--ink)}
  .vast{stroke:var(--good);stroke-width:1.2}
  .endpt{fill:var(--petrol);stroke:var(--surface);stroke-width:2}
  .endlab{font-size:12px;font-weight:700;fill:var(--ink)}
  .chart{display:flex;align-items:flex-end;gap:4px;height:150px;margin-top:16px;border-bottom:1px solid var(--line)}
  .bar{flex:1;background:#e4d3ab;border-radius:4px 4px 0 0;min-height:3px}
  .bar.last{background:var(--honey)}
  .rrow{display:flex;align-items:center;gap:12px;margin:13px 0}
  .rlab{width:52px;font-size:12.5px;color:var(--mute);font-weight:600}
  .rtrack{flex:1;height:14px;background:#efe6cf;border-radius:8px;overflow:hidden}
  .rfill{height:100%;border-radius:8px;transition:width .5s ease}
  .rval{width:44px;text-align:right;font-weight:700;font-size:13.5px}
  .empty{text-align:center;padding:44px 24px}
  .empty .emoji{font-size:40px}
  .empty h2{margin:10px 0 6px;font-size:19px}
  .empty p{color:var(--mute);font-size:13.5px;line-height:1.6;max-width:460px;margin:0 auto}
  .dim{color:var(--mute);font-size:12.5px;margin-top:10px}
  .foot{text-align:center;color:var(--mute);font-size:11.5px;margin-top:22px;line-height:1.5}
  .seg{display:flex;gap:6px;margin:0 0 14px;flex-wrap:wrap}
  .seg button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:20px;padding:7px 14px;font-size:13px;font-weight:600;cursor:pointer}
  .seg button[aria-pressed="true"]{background:var(--petrol);border-color:var(--petrol);color:var(--ivory)}
  .seg .n{opacity:.7;font-weight:400;margin-left:4px}
  .ptag{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:10px;background:#efe6cf;color:var(--mute);margin-left:6px}
  .loading{color:var(--mute);font-weight:700}
  .skel{background:linear-gradient(90deg,#f0e7cf 25%,#f7efd9 37%,#f0e7cf 63%);background-size:400% 100%;animation:sh 1.3s ease infinite;border-radius:12px}
  @keyframes sh{0%{background-position:100% 0}100%{background-position:-100% 0}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <img class="dot" src="icon-192-v2.png" width="30" height="30" alt="">
    <h1>Mona · Retentie</h1>
    <button class="refresh" id="refreshBtn" aria-label="Ververs">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
    </button>
  </div>
  <div class="subline" id="subline"><span class="live">● live</span> · verbinden…</div>
  <div class="seg" id="seg" role="group" aria-label="Platform" hidden></div>
  <div id="content"></div>
  <div id="devices"></div>
  <div class="foot">🔒 Volledig anoniem · geen persoonlijke data · alleen als de gebruiker "anonymous stats" zelf aanzet</div>
</div>

<script>
  const ENDPOINT = "https://script.google.com/macros/s/AKfycbwyXG20GVvMnyhARTVKtHVjNTLfy9D0wRLByIpGxFX2A3ylxTngC2UmBNdnHLxVOFUy/exec";
  const LS_KEY = "mona-stats-last";
  const content = document.getElementById('content');
  const subline = document.getElementById('subline');
  const refreshBtn = document.getElementById('refreshBtn');

  /* Platform: Alles, Android of iOS. Sinds 26 okt 2026 levert Code.gs de samenvatting ook per
     platform (summary.platforms) en de daggrafiek per platform (daily[].android/.ios). Een
     oudere Code.gs kent die velden niet: dan blijft de keuzebalk verborgen en toont de app het
     totaal, zoals altijd. */
  const PLAT_KEY = "mona-stats-plat";
  const PLATS = [['all','Alles'],['android','Android'],['ios','iOS']];
  let PLAT = (() => { try { return localStorage.getItem(PLAT_KEY) || 'all'; } catch(e){ return 'all'; } })();
  let lastData = null, lastMeta = null, lastDevices = null;
  const seg = document.getElementById('seg');

  function renderSeg(data){
    const pl = data && data.summary && data.summary.platforms;
    if (!pl) { seg.hidden = true; PLAT = 'all'; return; }
    seg.hidden = false;
    const count = (k) => k === 'all' ? data.summary.devices : (pl[k] ? pl[k].devices : 0);
    seg.innerHTML = PLATS.map(([k, label]) =>
      '<button data-p="' + k + '" aria-pressed="' + (PLAT === k) + '">' + label + '<span class="n">' + count(k) + '</span></button>'
    ).join('');
    seg.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
      PLAT = b.dataset.p;
      try { localStorage.setItem(PLAT_KEY, PLAT); } catch(e){}
      if (lastData) renderDashboard(lastData, lastMeta);
      if (lastDevices) renderDevices(lastDevices);
    }));
  }

  /** De gekozen kant van de data: samenvatting en daggrafiek voor Alles, Android of iOS. */
  function view(data){
    const all = data.summary || data;
    const pl = all.platforms;
    if (PLAT === 'all' || !pl || !pl[PLAT]) return { s: all, series: data.daily || [] };
    const series = (data.daily || [])
      .filter(x => x[PLAT] && x[PLAT].n > 0)
      .map(x => ({ day: x.day, avg: x[PLAT].avg, n: x[PLAT].n }));
    return { s: pl[PLAT], series };
  }

  const esc = (s) => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  const pct = (r) => (!r || r.rate === null) ? 'nog niets' : Math.round(r.rate * 100) + '%';

  function timeAgo(ts){
    if(!ts) return '';
    const s = Math.round((Date.now() - ts)/1000);
    if(s < 60) return 'zojuist';
    const m = Math.round(s/60); if(m < 60) return m + ' min geleden';
    const h = Math.round(m/60); if(h < 24) return h + ' uur geleden';
    return Math.round(h/24) + ' dagen geleden';
  }

  /* De regel boven de inbelgrafiek. Zelfde logica als trendCallout() in Code.gs (27 okt
     2026): de laatste 7 dagen tegenover de 7 dagen twee weken eerder, gewogen naar het
     aantal toestellen, en alleen als er in allebei op minstens één dag 3 toestellen waren.
     Tot dan vergeleek deze app de eerste 7 met alleen de laatste 3 dagen, op cijfers die het
     moment van de ping maten (punt 16c), met de tekst "mensen gaan minder vaak online". */
  function trendCallout(series){
    const last = series.slice(-21);
    if (last.length < 14) return null;
    const win = (xs) => {
      let sum = 0, n = 0, maxn = 0;
      xs.forEach(x => { const k = x.n || 0; sum += x.avg * k; n += k; if (k > maxn) maxn = k; });
      return { avg: n ? sum / n : 0, maxn };
    };
    const a = win(last.slice(0, 7)), b = win(last.slice(-7));
    if (a.maxn < 3 || b.maxn < 3 || a.avg <= 0) return null;
    const chg = Math.round((b.avg - a.avg) / a.avg * 100);
    const who = ' (' + b.maxn + ' toestellen)';
    if (chg <= -1) return { text: '▼ ' + Math.abs(chg) + '% minder inbellen dan twee weken eerder' + who, cls: 'callout' };
    if (chg >= 1) return { text: '▲ ' + chg + '% vaker inbellen dan twee weken eerder' + who, cls: 'callout up' };
    return { text: 'Even vaak inbellen als twee weken eerder' + who, cls: 'callout flat' };
  }

  /* Het verloop van de retentie door de tijd, uit 'history' (Code.gs Versie 10 en later).
     Bij Alles: d30 en d7. Per platform levert Code.gs alleen d30, dus dan alleen die lijn.
     Kent het Apps Script 'history' nog niet, dan blijft de kaart weg. */
  const DAY = 864e5;
  const dd = (a, b) => Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / DAY);
  const plus = (day, n) => { const d = new Date(day + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
  const MAANDEN = ['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'];
  const dag = (day) => Number(day.slice(8)) + ' ' + MAANDEN[Number(day.slice(5, 7)) - 1];

  function verloopCard(data){
    if (!Array.isArray(data.history)) return '';
    const plat = PLAT !== 'all';
    const r30 = (h) => plat ? (h[PLAT] && h[PLAT].d30) : h.d30;
    const r7 = (h) => plat ? null : h.d7;
    const rate = (r) => (r && r.eligible) ? r.retained / r.eligible : null;
    const pts = data.history.filter(h => rate(r30(h)) !== null || rate(r7(h)) !== null);
    const head = '<div class="card full"><div class="ey">Verloop · retentie per dag sinds de start' +
      (plat ? ' · ' + (PLAT === 'ios' ? 'iOS' : 'Android') : '') + '</div>';
    if (pts.length < 2) {
      return head + '<p class="dim">' + (data.history.length
        ? 'Nog te weinig dagen met genoeg toestellen om een lijn te tekenen.'
        : 'Nog geen verloop. Draai één keer terugrekenen() in de Apps Script-editor; daarna komt er elke nacht een dag bij.') +
        '</p></div>';
    }
    const W = 900, H = 230, L = 40, R = 14, T = 26, B = 26;
    const d0 = pts[0].day, dN = pts[pts.length - 1].day, span = Math.max(1, dd(d0, dN));
    let maxv = 0.6;
    pts.forEach(p => [rate(r7(p)), rate(r30(p))].forEach(v => { if (v !== null && v + 0.05 > maxv) maxv = Math.min(1, v + 0.05); }));
    const x = (day) => L + (W - L - R) * dd(d0, day) / span;
    const y = (v) => T + (H - T - B) * (1 - v / maxv);
    const line = (get, cls) => {
      const segs = []; let cur = [];
      pts.forEach(p => {
        const v = rate(get(p));
        if (v === null) { if (cur.length) segs.push(cur); cur = []; return; }
        cur.push(x(p.day).toFixed(1) + ',' + y(v).toFixed(1));
      });
      if (cur.length) segs.push(cur);
      return segs.map(sg => '<polyline class="' + cls + '" points="' + sg.join(' ') + '"/>').join('');
    };
    let g = '';
    [0.10, 0.20, 0.35].forEach(b => {
      const yy = y(b).toFixed(1);
      g += '<line class="band" x1="' + L + '" x2="' + (W - R) + '" y1="' + yy + '" y2="' + yy + '"/>' +
           '<text class="ax" x="' + (L - 6) + '" y="' + (Number(yy) + 4) + '" text-anchor="end">' + Math.round(b * 100) + '%</text>';
    });
    for (let d = d0; d <= dN; d = plus(d, 1)) {
      if (d.slice(8) === '01' || d === d0) g += '<text class="ax" x="' + x(d).toFixed(1) + '" y="' + (H - 6) + '" text-anchor="middle">' + dag(d) + '</text>';
    }
    let nr = 0; const legenda = [];
    (Array.isArray(data.meetversies) ? data.meetversies : []).forEach(m => {
      if (!m || !m.vanaf || m.vanaf <= d0 || m.vanaf > dN) return;
      nr++;
      const xx = x(m.vanaf).toFixed(1);
      g += '<line class="mark" x1="' + xx + '" x2="' + xx + '" y1="' + (T - 8) + '" y2="' + (H - B) + '"/>' +
           '<circle class="markdot" cx="' + xx + '" cy="' + (T - 14) + '" r="8"/>' +
           '<text class="marknr" x="' + xx + '" y="' + (T - 10.5) + '" text-anchor="middle">' + nr + '</text>';
      legenda.push('<span><b>' + nr + '</b> ' + dag(m.vanaf) + ': ' + esc(m.tekst || '') + '</span>');
    });
    const vast = pts.find(p => p.soort === 'vastgelegd');
    if (vast && vast.day > d0) {
      const xv = x(vast.day);
      g += '<line class="vast" x1="' + xv.toFixed(1) + '" x2="' + xv.toFixed(1) + '" y1="' + T + '" y2="' + (H - B) + '"/>' +
        (xv > W * 0.6
          ? '<text class="ax" x="' + (xv - 4).toFixed(1) + '" y="' + (T + 10) + '" text-anchor="end">vastgelegd vanaf hier</text>'
          : '<text class="ax" x="' + (xv + 4).toFixed(1) + '" y="' + (T + 10) + '">vanaf hier vastgelegd</text>');
    }
    let lastP = null;
    pts.forEach(p => { if (rate(r30(p)) !== null) lastP = p; });
    if (lastP) {
      const r = r30(lastP), lv = rate(r);
      g += '<circle class="endpt" cx="' + x(lastP.day).toFixed(1) + '" cy="' + y(lv).toFixed(1) + '" r="4.5"/>' +
           '<text class="endlab" x="' + (x(lastP.day) - 8).toFixed(1) + '" y="' + (y(lv) - 9).toFixed(1) + '" text-anchor="end">d30 ' +
           Math.round(lv * 100) + '% (' + r.retained + '/' + r.eligible + ')</text>';
    }
    return head +
      '<div class="verloop"><svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Verloop van de retentie per dag">' +
        g + (plat ? '' : line(r7, 'l7')) + line(r30, 'l30') + '</svg></div>' +
      '<div class="legend"><span><i class="sw" style="background:var(--petrol)"></i> 30 dagen</span>' +
        (plat ? '' : '<span><i class="sw" style="background:var(--honey)"></i> 7 dagen</span>') +
        '<span>stippellijnen: de grenzen uit PRODUCT-DIRECTION.md</span></div>' +
      (legenda.length ? '<div class="legend">' + legenda.join('') + '</div>' : '') +
    '</div>';
  }

  function renderDashboard(data, meta){
    lastData = data; lastMeta = meta;
    renderSeg(data);
    const { s, series } = view(data);
    const d30 = s.retention_d30, d14 = s.retention_d14, d7 = s.retention_d7;

    // Banden uit PRODUCT-DIRECTION.md sectie 6, de kill-criteria, gelijk aan het dashboard
    // in Code.gs sinds 23 sep 2026. Deze app hield tot 27 okt 2026 de oude, strengere tabel
    // (GEZOND vanaf 40, OK vanaf 25, anders STOP), waardoor hetzelfde cijfer hier anders heette.
    let status, statusClass;
    if (!d30 || d30.rate === null) { status = 'NOG TE VROEG'; statusClass = 'b-none'; }
    else if (d30.rate > 0.35) { status = 'OPTIMISTISCH'; statusClass = 'b-good'; }
    else if (d30.rate >= 0.20) { status = 'VEELBELOVEND'; statusClass = 'b-good'; }
    else if (d30.rate >= 0.10) { status = 'PRIL'; statusClass = 'b-ok'; }
    else { status = 'TWIJFEL'; statusClass = 'b-stop'; }

    // subline: live vs cached
    // Drie standen. Tot 26 okt stond een bewaarde versie tijdens het laden als "live" in beeld,
    // met de datum van toen; daardoor leek het dashboard dagen achter te lopen.
    const stamp = meta && meta.loading
      ? '<span class="loading">● laden</span> · laatst opgehaald ' + esc(timeAgo(meta.ts))
      : meta && meta.cached
      ? '<span class="stale">● offline</span> · laatst opgehaald ' + esc(timeAgo(meta.ts))
      : '<span class="live">● live</span> · bijgewerkt ' + esc(s.today || '');
    const ping = (PLAT !== 'all' && s.last_ping)
      ? ' · laatste ping ' + esc(s.last_ping) + (s.latest_build ? ', build ' + esc(s.latest_build) : '')
      : '';
    subline.innerHTML = stamp + ping + ' · anoniem, opt-in';

    if (s.devices === 0 && PLAT !== 'all') {
      content.innerHTML =
        '<div class="card full empty"><div class="emoji">📡</div><h2>Nog geen ' + (PLAT === 'ios' ? 'iOS' : 'Android') + '-data</h2>' +
        '<p>Er heeft nog geen toestel op dit platform de anonieme statistiek aangezet. Testers zetten dat aan bij de stap <b>"Help je MONA beter maken?"</b> of later in de instellingen.</p></div>';
      return;
    }
    if (s.devices === 0) {
      content.innerHTML =
        '<div class="card full empty"><div class="emoji">📡</div><h2>Nog geen data</h2>' +
        '<p>Het dashboard vult zich zodra testers in de app onderin <b>"anonymous stats"</b> aanzetten. ' +
        'Zodra het eerste toestel binnenkomt, verschijnt het hier binnen een dag.</p></div>';
      return;
    }

    // trend bars
    const last = series.slice(-21);
    let maxv = 1; last.forEach(x => { if (x.avg > maxv) maxv = x.avg; });
    const bars = last.map((x, i) => {
      const h = Math.max(3, Math.round(x.avg / maxv * 100));
      return '<div class="bar' + (i === last.length - 1 ? ' last' : '') + '" style="height:' + h + '%" title="' +
        esc(x.day) + ': ' + x.avg.toFixed(1) + ' dial-ins"></div>';
    }).join('');
    const callout = trendCallout(series);

    const rrow = (label, r) => {
      const w = (!r || r.rate === null) ? 0 : Math.round(r.rate * 100);
      const val = (!r || r.rate === null) ? 'nog niets' : w + '%';
      const col = (r && r.rate !== null && r.n === 30) ? 'var(--good)' : 'var(--petrol)';
      return '<div class="rrow"><div class="rlab">' + label + '</div><div class="rtrack"><div class="rfill" style="width:' +
        w + '%;background:' + col + '"></div></div><div class="rval">' + val + '</div></div>';
    };

    const trendCard = series.length
      ? '<div class="card full">' +
          '<div class="trendhead"><div class="ey">Gemiddeld inbellen per toestel per dag · laatste ' + last.length + ' dagen</div>' +
            (callout ? '<div class="' + callout.cls + '">' + esc(callout.text) + '</div>' : '') + '</div>' +
          (last.length ? '<div class="chart">' + bars + '</div>' : '<p class="dim">Nog te weinig dagen om een trend te tonen.</p>') +
          '<p class="dim">Gemeten met wat de app de dag erna als "gisteren" doorgeeft. De laatste staaf is gisteren.</p>' +
        '</div>'
      : '';

    content.innerHTML =
      '<div class="grid">' +
        '<div class="card hero">' +
          '<div class="ey">De kill-metric · 30-dagen retentie</div>' +
          '<div class="herorow"><div class="big">' + pct(d30) + '</div><div class="badge ' + statusClass + '">● ' + status + '</div></div>' +
          '<div class="hint">Van de mensen die ≥30 dagen geleden begonnen, houdt <b>' + pct(d30) + '</b> Mona nog áán' +
            (d30 && d30.eligible ? ' (' + d30.retained + '/' + d30.eligible + ').' : '. Nog te weinig toestellen ouder dan 30 dagen om te meten.') + '</div>' +
          '<div class="legend"><span><i class="sw" style="background:var(--good)"></i> ≥20% veelbelovend, &gt;35% optimistisch</span>' +
            '<span><i class="sw" style="background:var(--honey)"></i> 10 tot 20% pril</span>' +
            '<span><i class="sw" style="background:var(--coral)"></i> &lt;10% twijfel</span></div>' +
        '</div>' +
        '<div class="tiles">' +
          '<div class="tile"><div class="tnum">' + s.devices + '</div><div class="tlab">toestellen<br>delen data</div></div>' +
          '<div class="tile"><div class="tnum">' + s.active_last_7d + '</div><div class="tlab">actief in de<br>laatste 7 dagen</div></div>' +
          '<div class="tile"><div class="tnum">' + s.enabled_and_active + '</div><div class="tlab">Mona staat nog<br>áán &amp; handhaaft</div></div>' +
        '</div>' +
        trendCard +
        '<div class="card full">' +
          '<div class="ey">Retentie met Mona áán, na hoeveel dagen</div>' +
          rrow('7 dgn', d7) + rrow('14 dgn', d14) + rrow('30 dgn', d30) +
        '</div>' +
        verloopCard(data) +
      '</div>';
  }

  function renderSkeleton(){
    content.innerHTML =
      '<div class="grid">' +
        '<div class="card hero"><div class="skel" style="height:16px;width:60%"></div><div class="skel" style="height:56px;width:45%;margin-top:14px"></div><div class="skel" style="height:40px;width:90%;margin-top:16px"></div></div>' +
        '<div class="tiles">' +
          '<div class="tile"><div class="skel" style="height:44px;width:100%"></div></div>' +
          '<div class="tile"><div class="skel" style="height:44px;width:100%"></div></div>' +
          '<div class="tile"><div class="skel" style="height:44px;width:100%"></div></div>' +
        '</div>' +
        '<div class="card full"><div class="skel" style="height:150px;width:100%"></div></div>' +
      '</div>';
  }

  function renderError(cached){
    if (cached) { renderDashboard(cached.data, {cached:true, ts:cached.ts}); return; }
    subline.innerHTML = '<span class="stale">● geen verbinding</span>';
    content.innerHTML =
      '<div class="card full empty"><div class="emoji">📵</div><h2>Geen verbinding</h2>' +
      '<p>Kon de cijfers niet ophalen en er is nog geen eerdere versie bewaard. Controleer je internet en tik op ⟳ om opnieuw te proberen.</p></div>';
  }

  function loadCached(){
    try { const v = localStorage.getItem(LS_KEY); return v ? JSON.parse(v) : null; } catch(e){ return null; }
  }
  function saveCached(data){
    try { localStorage.setItem(LS_KEY, JSON.stringify({data, ts: Date.now()})); } catch(e){}
  }

  let loading = false;
  async function load(){
    if (loading) return;
    loading = true;
    refreshBtn.classList.add('spin');
    const cached = loadCached();
    if (!content.children.length) { if (cached) renderDashboard(cached.data, {loading:true, ts:cached.ts}); else renderSkeleton(); }
    try {
      const res = await fetch(ENDPOINT + '?format=json', { cache: 'no-store' });
      const data = await res.json();
      if (!data || data.ok === false) throw new Error('bad payload');
      saveCached(data);
      renderDashboard(data, {cached:false});
    } catch(e){
      renderError(cached);
    } finally {
      loading = false;
      refreshBtn.classList.remove('spin');
    }
  }

  /* ---------------------------------------------------------------- toestellen
     Leest de losse id-lijst uit. Werkt alleen als het Apps Script het format 'devices'
     kent; zo niet, dan blijft dit blok gewoon onzichtbaar.

     Tot 27 okt 2026 noemde dit blok elk toestel dat vandaag niet pingde "kandidaat om op
     te ruimen". Dat was verkeerd: een toestel dat stopt is een afhaker, en die hoort
     juist in de noemer van de retentie (PRODUCT-DIRECTION.md, sectie 6). Nu staat er
     actief of gestopt, en uitsluiten gebeurt alleen in Code.gs, met een vastgelegde reden. */
  const JUNK = ['m1','mdemo','mdemo1'];
  const devBox = document.getElementById('devices');

  function today(){ return new Date().toISOString().slice(0,10); }

  function renderDevices(list){
    lastDevices = list;
    if (!list || !list.length) { devBox.innerHTML=''; return; }
    const t = today();
    const mine = PLAT === 'all' ? list : list.filter(d => (d.p || 'android') === PLAT);
    if (!mine.length) { devBox.innerHTML=''; return; }
    const rows = mine.slice().sort((a,b)=> (a.last < b.last ? 1 : -1)).slice(0,80);
    const ago = (day) => Math.round((new Date(t + 'T00:00:00') - new Date(day + 'T00:00:00')) / 864e5);
    const isActive = (d) => JUNK.indexOf(d.id) < 0 && ago(d.last) <= 7;
    const active = rows.filter(isActive).length;
    devBox.innerHTML =
      '<div class="card full" style="margin-top:14px">' +
        '<div class="ey">Toestellen, nieuwste eerst</div>' +
        '<div class="hint" style="margin-top:8px">' + rows.length + ' id\'s. ' +
          '<b>' + active + '</b> actief in de laatste 7 dagen, ' + (rows.length - active) + ' gestopt. ' +
          'Gestopte toestellen blijven bewust meetellen: dat is de uitval die de retentie moet laten zien.' +
        '</div>' +
        '<div style="margin-top:12px">' +
        rows.map(function(d){
          const junk = !isActive(d);
          return '<div style="display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:12.5px' +
            (junk ? ';opacity:.55' : '') + '">' +
            '<span style="font-family:monospace">' + esc(d.id) + (junk ? ' ●' : '') +
              (d.p ? '<span class="ptag">' + (d.p === 'ios' ? 'iOS' : 'Android') + (d.v ? ' · build ' + esc(d.v) : '') + '</span>' : '') + '</span>' +
            '<span style="color:var(--mute)">' + esc(d.first) + ' tot ' + esc(d.last) + ' · ' + esc(d.pings) + 'x</span>' +
          '</div>';
        }).join('') +
        '</div>' +
      '</div>';
  }

  async function loadDevices(){
    try {
      const res = await fetch(ENDPOINT + '?format=devices', { cache: 'no-store' });
      const data = await res.json();
      if (data && data.ok && data.devices) renderDevices(data.devices);
    } catch(e){ /* endpoint nog niet gedeployed: laat het blok weg */ }
  }

  refreshBtn.addEventListener('click', function(){ load(); loadDevices(); });
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { load(); loadDevices(); } });
  loadDevices();
  window.addEventListener('online', load);
  load();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
  }
</script>
</body>
</html>
